<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Grundriss Darstellung</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    canvas { display: block; }

    #infobox {
      display: none;
      position: fixed;
      z-index: 10;
      background: #ffffff;
      border: 1px solid #000000;
      padding: 8px 12px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none; /* Klicks sollen "durch" die Box zur Szene durchgehen */
    }

    .raum-beschriftung {
      position: fixed;
      z-index: 5;
      font-family: sans-serif;
      font-size: 12px;
      color: #000000;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(0, -50%); /* vertikal auf der Linie zentrieren */
    }
  </style>
</head>
<body>

  <div id="infobox"></div>

  <!-- Import Map: definiert, woher der Browser "three" und "three/addons/" beim import laden soll -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <!-- Einlesen der CSV mit papaparse-->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Laden des Codes -->
  <script type="module" src="main.js"></script>

</body>
</html>
